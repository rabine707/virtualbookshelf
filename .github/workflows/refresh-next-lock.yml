name: Refresh Next.js security upgrade

on:
  push:
    branches:
      - ci-only/architecture-batch-20260812

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-only/architecture-batch-20260812

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js and refresh lockfile
        run: npm install next@16.3.0 --save-exact --package-lock-only

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 16.3.0 for security fixes"
          git push origin HEAD:ci-only/architecture-batch-20260812
