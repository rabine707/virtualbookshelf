name: Dependency audit

on:
  push:
    branches:
      - ci-only/architecture-batch-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect npm advisories after security upgrade
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(report.metadata || {}, null, 2));
          for (const [name, issue] of Object.entries(report.vulnerabilities || {})) {
            console.log('\nVULNERABILITY', name);
            console.log(JSON.stringify({
              severity: issue.severity,
              isDirect: issue.isDirect,
              via: issue.via,
              effects: issue.effects,
              range: issue.range,
              nodes: issue.nodes,
              fixAvailable: issue.fixAvailable,
            }, null, 2));
          }
          NODE
