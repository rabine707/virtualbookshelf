name: Refactor spine gallery storage

on:
  push:
    branches:
      - ci-only/architecture-batch-20260812

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-only/architecture-batch-20260812

      - name: Consolidate gallery spine storage
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/SpineGallery.tsx")
          text = path.read_text()

          text = text.replace(
              'import { useEffect } from "react";\n\n',
              'import { useEffect } from "react";\nimport {\n  getGeneratedSpine,\n  getGeneratedSpineMode,\n  readSpineStoreValue,\n  saveGeneratedSpine,\n  writeSpineStoreValue,\n  type SpinePosition,\n  type SpineRenderMode,\n} from "../lib/spines/client";\n\n',
              1,
          )

          for line in (
              'const DB_NAME = "shelf-of-fame-art";\n',
              'const STORE_NAME = "generated-spines";\n',
              'const DB_VERSION = 1;\n',
              'const MODE_KEY_PREFIX = "mode:";\n',
          ):
              if line not in text:
                  raise SystemExit(f"Expected storage constant not found: {line.strip()}")
              text = text.replace(line, "", 1)

          old_types = 'type SpinePosition = "left" | "center" | "right";\ntype SpineRenderMode = "integrated" | "overlay";\n\n'
          if old_types not in text:
              raise SystemExit("Expected local spine types were not found")
          text = text.replace(old_types, "", 1)

          start = text.index("function openDb()")
          end = text.index("function historyKey")
          replacement = '''async function activeSpine(coverUrl: string) {\n  return (await getGeneratedSpine(coverUrl)) || "";\n}\n\nasync function activeMode(coverUrl: string): Promise<SpineRenderMode> {\n  return getGeneratedSpineMode(coverUrl);\n}\n\nasync function saveActiveSpine(book: BookIdentity, choice: SpineChoice) {\n  await saveGeneratedSpine(book.coverUrl, choice.image, choice.renderMode);\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace("readStore<", "readSpineStoreValue<")
          text = text.replace("writeStore(", "writeSpineStoreValue(")

          path.write_text(text)

      - name: Commit gallery refactor
        shell: bash
        run: |
          if git diff --quiet -- app/SpineGallery.tsx; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/SpineGallery.tsx
          git commit -m "Use shared spine storage in gallery"
          git push origin HEAD:ci-only/architecture-batch-20260812
