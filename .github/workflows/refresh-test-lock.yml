name: Refresh test lockfile

on:
  push:
    branches: [agent/add-test-coverage]

permissions:
  contents: write

concurrency:
  group: refresh-test-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/add-test-coverage

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Sync test dependency lockfile"
          git push origin HEAD:agent/add-test-coverage
