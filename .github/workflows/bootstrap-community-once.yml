name: Bootstrap community once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-community-once.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Run optimized BookTok-first community seed
        run: |
          set -euo pipefail
          curl --location --fail --show-error --silent --max-time 120 \
            --output response.txt \
            --write-out 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nCONTENT_TYPE=%{content_type}\n' \
            https://virtualbookshelf-git-main-ready-set-ink.vercel.app/api/admin/bootstrap-booktok-8c4f7a
          echo '--- RESPONSE ---'
          cat response.txt
          echo
