name: Stabilize cover reset test

on:
  push:
    branches:
      - ci-only/architecture-batch-20260812

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci-only/architecture-batch-20260812

      - name: Replace transient toast assertion with durable reset state
        shell: python
        run: |
          from pathlib import Path
          path = Path("e2e/shelf-smoke.spec.ts")
          text = path.read_text()
          old = '''  await expect(page.locator('.toast[role="status"]')).toContainText("Reset cover choices for Fourth Wing");\n  await expect.poll(() => page.evaluate(() => (window as typeof window & { __coverResetMarker?: string }).__coverResetMarker)).toBe("alive");\n'''
          new = '''  await expect(resetCover).toBeDisabled();\n  await expect.poll(() => page.evaluate(() => {\n    const books = JSON.parse(window.localStorage.getItem("shelf-of-fame-library-v1") || "[]") as Array<{\n      title?: string;\n      preferredCover?: unknown;\n      coverFeedback?: unknown;\n    }>;\n    const book = books.find((item) => item.title === "Fourth Wing");\n    return Boolean(book && !book.preferredCover && !book.coverFeedback);\n  })).toBe(true);\n  await expect.poll(() => page.evaluate(() => (window as typeof window & { __coverResetMarker?: string }).__coverResetMarker)).toBe("alive");\n'''
          if old not in text:
              raise SystemExit("Cover reset toast assertion not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit stable reset assertion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/shelf-smoke.spec.ts
          git commit -m "Stabilize cover reset browser assertion"
          git push origin HEAD:ci-only/architecture-batch-20260812
